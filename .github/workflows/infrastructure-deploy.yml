name: Infrastructure Deployment

on:
  workflow_dispatch:

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Account
        run: |
          az account show --query "{subscriptionId:id, tenantId:tenantId}" -o table
