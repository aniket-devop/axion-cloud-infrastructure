apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aniket-devop/axion-cloud-infrastructure.git
    targetRevision: gitops-setup
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: axion-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
