apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-dev
  namespace: argocd
spec:
  project: axion
  source:
    repoURL: https://github.com/aniket-devop/axion-cloud-infrastructure.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: axion-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
