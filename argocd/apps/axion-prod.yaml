apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: axion-prod
  namespace: argocd
spec:
  project: axion
  source:
    repoURL: https://github.com/aniket-devop/axion-cloud-infrastructure.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: axion-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
