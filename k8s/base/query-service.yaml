apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-query-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axion-query-service
  template:
    metadata:
      labels:
        app: axion-query-service
    spec:
      containers:
        - name: query-service
          image: axionacr20260909.azurecr.io/axion-telemetry-query-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: axion-db-secret
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: axion-query-service
spec:
  selector:
    app: axion-query-service
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer
