apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: axion-dev
resources:
  - ../../base

images:
  - name: axionacraniket1026.azurecr.io/axion-ui
    newTag: initial
  - name: axionacraniket1026.azurecr.io/axion-ingestion-service
    newTag: initial
  - name: axionacraniket1026.azurecr.io/axion-telemetry-query-service
    newTag: initial
  - name: axionacraniket1026.azurecr.io/axion-data-simulator
    newTag: initial

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: acr-secret