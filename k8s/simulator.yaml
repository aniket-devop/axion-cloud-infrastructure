apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-data-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axion-data-simulator
  template:
    metadata:
      labels:
        app: axion-data-simulator
    spec:
      containers:
        - name: simulator
          image: axionacr20260909.azurecr.io/axion-data-simulator:latest
          imagePullPolicy: Always
          env:
            - name: API_URL
              value: "http://axion-ingestion:8000/api/v1/telemetry/ingest"
            - name: INTERVAL_SECONDS
              value: "5"
